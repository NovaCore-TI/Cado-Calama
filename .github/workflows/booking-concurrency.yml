name: Booking concurrency
on:
  push:
    branches: [test, main]
    paths: ['src/**', 'supabase/**', 'tests/**', 'package*.json', '.github/workflows/booking-concurrency.yml']
  pull_request:
    paths: ['src/**', 'supabase/**', 'tests/**', 'package*.json', '.github/workflows/booking-concurrency.yml']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: cado_rf11_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:concurrency
        env:
          CADO_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/cado_rf11_ci
